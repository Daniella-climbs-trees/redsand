<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- RedSand favicon: a small red planet at dusk -->
  <defs>
    <radialGradient id="planet" cx="38%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#F2A08E"/>
      <stop offset="55%" stop-color="#C4504F"/>
      <stop offset="100%" stop-color="#8E4363"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#181530"/>
  <circle cx="32" cy="33" r="19" fill="url(#planet)"/>
  <!-- dune shadow across the planet -->
  <path d="M14 38 Q24 33 33 38 T51 37 A19 19 0 0 1 32 52 A19 19 0 0 1 14 38 Z" fill="#33182E" opacity=".55"/>
  <!-- tiny moon -->
  <circle cx="49" cy="14" r="3" fill="#E8D4C0"/>
</svg>
